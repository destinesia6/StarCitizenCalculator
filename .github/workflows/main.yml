name: Auto-Versioning Release Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write 

jobs:
  mirror-code-to-aurorahub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push Code & Tags to Forgejo 
        run: |
          git config --global credential.helper '!f() { echo "username=destinesia"; echo "password=${{ secrets.FORGEJO_TOKEN }}"; }; f'
          git remote add forgejo https://code.aurorahub.uk/destinesia/StarCitizenCalculator.git
          # This safely maps GitHub's refs directly to Forgejo, bypassing detached HEAD issues
          git push forgejo '+refs/remotes/origin/*:refs/heads/*' --force
          git push forgejo '+refs/tags/*:refs/tags/*' --force
          
  build-and-release:
    needs: mirror-code-to-aurorahub
    runs-on: windows-latest
      
    # 2. Define environment variables in the 'env' section
    env:
      PROJECT_FILE: StarCitizenCalculator/StarCitizenCalculator.csproj
      APP_NAME: StarCitizenCalculator
      VERSION: ${{ format('{0}.{1}', '1.0', github.run_number) }}
    
    steps:
    
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    # Step 3: Publish the console application
    # We pass the generated version number to the publish command
    - name: Publish (Build EXE) with Version
      run: dotnet publish ${{ env.PROJECT_FILE }} --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=${{ env.VERSION }} -o release_output
      
    # Step 4: Archive the output (Create the .zip file)
    - name: Archive Build Artifact
      shell: powershell
      run: |
        $zipFileName = "${{ env.APP_NAME }}_v${{ env.VERSION }}_Win-x64.zip"
        Compress-Archive -Path .\release_output\* -DestinationPath $zipFileName
        

    - name: Create Git Tag
      id: tag_create
      uses: actions/github-script@v7
      with:
        # Pass environment variables directly as inputs to the action
        VERSION: ${{ env.VERSION }} 
        
        script: |
          // Access the variable using the input name (e.g., 'VERSION')
          const newTag = `v${process.env.VERSION}`;
          console.log(`Creating tag: ${newTag}`);
          
          // ... rest of the script (uses core to set output) ...
          await github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: `refs/tags/${newTag}`,
            sha: context.sha
          });
          core.setOutput('tag', newTag);
          
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag_create.outputs.tag }} 
        name: Delivery Calculator ${{ env.VERSION }}
        body: |
          Automatic release for build version ${{ env.VERSION }}.
          
          This build includes all commits since the last successful release.
        draft: false
        prerelease: false
        files: ${{ env.APP_NAME }}_v${{ env.VERSION }}_Win-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish Windows Release to Forgejo
      uses: akkuman/gitea-release-action@v1
      with:
        server_url: https://code.aurorahub.uk
        repository: destinesia/StarCitizenCalculator
        token: ${{ secrets.FORGEJO_TOKEN }}
        tag_name: "${{ steps.tag_create.outputs.tag }}"
        name: "Delivery Calculator ${{ env.VERSION }}"
        files: ${{ env.APP_NAME }}_v${{ env.VERSION }}_Win-x64.zip
